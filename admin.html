<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>StyleSwift Admin — Code Generator</title>
<style>
  :root {
    --bg: #0d0d0f;
    --bg2: #141417;
    --bg3: #1c1c21;
    --border: #2a2a32;
    --gold: #f0b429;
    --gold2: #c9820a;
    --muted: #636b8a;
    --muted2: #9999bb;
    --white: #f4f4f6;
    --error: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--white);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px 24px;
  }
  h1 {
    font-size: 16px;
    font-weight: 700;
    margin: 0 0 4px;
    color: var(--gold);
  }
  p.sub {
    font-size: 13px;
    color: var(--muted2);
    margin: 0 0 20px;
  }
  label {
    display: block;
    font-size: 12px;
    color: var(--muted2);
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 11px 12px;
    color: var(--white);
    font-size: 14px;
    margin-bottom: 16px;
  }
  input:focus { outline: none; border-color: var(--gold); }
  button {
    width: 100%;
    background: var(--gold);
    color: #1a1400;
    border: none;
    border-radius: 8px;
    padding: 12px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  button:hover { background: var(--gold2); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .result {
    margin-top: 20px;
    padding: 16px;
    background: var(--bg3);
    border: 1px solid rgba(240,180,41,0.3);
    border-radius: 10px;
    display: none;
  }
  .result.show { display: block; }
  .code-display {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--gold);
    text-align: center;
    margin-bottom: 10px;
    word-break: break-all;
  }
  .copy-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted2);
    font-weight: 600;
    font-size: 12px;
  }
  .copy-btn:hover { border-color: var(--gold); color: var(--gold); background: transparent; }
  .error-msg {
    color: var(--error);
    font-size: 13px;
    margin-top: 10px;
    display: none;
  }
  .error-msg.show { display: block; }
  .note {
    font-size: 11px;
    color: var(--muted);
    margin-top: 16px;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>✦ StyleSwift Admin</h1>
    <p class="sub">Generate a one-time Pro upgrade code after confirming MoMo payment.</p>

    <label for="admin-key">Admin Key</label>
    <input type="password" id="admin-key" placeholder="Enter admin key" autocomplete="off">

    <button id="generate-btn" onclick="generateCode()">Generate Pro Code →</button>

    <div class="error-msg" id="error-msg"></div>

    <div class="result" id="result">
      <div class="code-display" id="code-display">—</div>
      <button class="copy-btn" onclick="copyCode()">Copy Code</button>
    </div>

    <div class="note">
      Each code is single-use and grants 30 days of Pro access from the moment it's redeemed — not from the moment it's generated. Confirm the MoMo payment (matching sender name) before generating.
    </div>
  </div>

<script>
async function generateCode() {
  const key = document.getElementById('admin-key').value.trim();
  const btn = document.getElementById('generate-btn');
  const errorEl = document.getElementById('error-msg');
  const resultEl = document.getElementById('result');

  errorEl.classList.remove('show');
  resultEl.classList.remove('show');

  if (!key) {
    errorEl.textContent = 'Enter the admin key first.';
    errorEl.classList.add('show');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Generating…';

  try {
    const res = await fetch('/api/generate-code?key=' + encodeURIComponent(key), {
      method: 'POST'
    });
    const data = await res.json();

    if (!res.ok || !data.code) {
      errorEl.textContent = data.error || 'Failed to generate code.';
      errorEl.classList.add('show');
    } else {
      document.getElementById('code-display').textContent = data.code;
      resultEl.classList.add('show');
    }
  } catch (err) {
    errorEl.textContent = 'Network error. Try again.';
    errorEl.classList.add('show');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Generate Pro Code →';
  }
}

function copyCode() {
  const code = document.getElementById('code-display').textContent;
  navigator.clipboard.writeText(code).then(() => {
    const btn = document.querySelector('.copy-btn');
    const original = btn.textContent;
    btn.textContent = 'Copied ✓';
    setTimeout(() => { btn.textContent = original; }, 1500);
  });
}
</script>
</body>
</html>
